{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "11dog.fullname" . }}-auth
  labels:
    {{- include "11dog.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ .Values.auth.adminToken | quote }}
  {{- if and (ne .Values.db.driver "sqlite") .Values.db.dsn }}
  db-dsn: {{ .Values.db.dsn | quote }}
  {{- end }}
{{- end }}
