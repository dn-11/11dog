# Set replicaCount=1 when db.driver=sqlite; switch db.driver=postgres for multi-replica HA.
replicaCount: 1

image:
  repository: ghcr.io/dn-11/11dog
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion (release charts pin the matching image tag)
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

siteTitle: "11Dog - DN11 网络测速平台"
networkName: "DN11"
agentDownloadBaseURL: ""

auth:
  # Set to an existing Secret name containing key `admin-token` (and optional `db-dsn`)
  existingSecret: ""
  adminToken: "change-me-dn11-admin-token"

db:
  # driver: "sqlite" (default single-replica PVC) or "postgres" (multi-replica HA)
  driver: "sqlite"
  # For sqlite defaults to /var/lib/11dog/11dog.db; for postgres provide DSN or use existingSecret key `db-dsn`
  dsn: ""
  existingSecret: ""
  sqlite:
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: ""

nats:
  # Deploy bundled JetStream NATS StatefulSet with decentralized JWT/NKey authentication.
  # Set enabled=false to point to an external NATS cluster via nats.url.
  enabled: true
  # Internal NATS URL used by 11dog-server. Defaults to nats://<fullname>-nats:4222 when nats.enabled=true.
  url: ""
  # External NATS WebSocket URL written into agent install scripts (ws:// or wss://, e.g. wss://nats.example.com).
  publicUrl: ""
  streamName: "DOG_TASKS"
  maxQueuePerNode: 20
  taskTTLSec: 60
  tlsCAFile: ""
  tlsInsecureSkipVerify: false
  image:
    repository: nats
    tag: "2.10-alpine"
    pullPolicy: IfNotPresent
  websocket:
    # NATS WebSocket listener port for edge agents (expose as wss:// behind Ingress/Nginx).
    port: 8443
  storageSize: 1Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  auth:
    # Use an existing Secret containing `account-seed` (and `nats-auth.conf` when nats.enabled=true).
    existingSecret: ""
    # Automatically initialize NATS Operator/SYS/11dog Account JWTs via a Helm pre-install/pre-upgrade Job
    # using natsio/nats-box (nsc). Idempotent: skips generation if the Secret already exists.
    autoInit: true
    initImage:
      repository: natsio/nats-box
      tag: "0.14.5"
      pullPolicy: IfNotPresent
    # Manual values used only when autoInit=false and existingSecret=""
    accountSeed: ""
    natsAuthConf: ""

limits:
  rateLimitRPM: 180
  rateLimitBurst: 30
  maxTargetLen: 512
  defaultTimeoutMs: 15000
  maxTimeoutMs: 60000
  taskHistoryTTLSec: 1800
  allowedCIDRs: []
  deniedCIDRs: []

dn11Registry:
  enabled: true
  url: "https://github.com/dn-11/registry/archive/HEAD.tar.gz"
  refreshIntervalSec: 1800

dn11Prefixes:
  - cidr: "172.16.0.0/16"
    asn: 4211110000
    owner: "DN11 Backbone"
    region: "DN11"

service:
  type: ClusterIP
  httpPort: 8080
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

serviceMonitor:
  enabled: false
  interval: 15s
  labels: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
