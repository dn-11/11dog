apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dn11dog.fullname" . }}-config
  labels:
    {{- include "dn11dog.labels" . | nindent 4 }}
data:
  server.yaml: |
    http_listen_addr: ":8080"
    public_ws_addr: {{ .Values.publicWSAddr | quote }}
    agent_bin_dir: "/opt/11dog/downloads"
    agent_download_base_url: {{ .Values.agentDownloadBaseURL | quote }}
    site_title: {{ .Values.siteTitle | quote }}
    network_name: {{ .Values.networkName | quote }}
    db:
      driver: {{ .Values.db.driver | quote }}
      {{- if eq .Values.db.driver "sqlite" }}
      dsn: {{ default "/var/lib/11dog/11dog.db" .Values.db.dsn | quote }}
      {{- else }}
      dsn: {{ .Values.db.dsn | quote }}
      {{- end }}
    mq:
      driver: {{ .Values.mq.driver | quote }}
      nats_url: {{ include "dn11dog.natsUrl" . | quote }}
      stream_name: {{ .Values.mq.streamName | quote }}
      max_queue_per_node: {{ .Values.mq.maxQueuePerNode }}
      task_ttl_sec: {{ .Values.mq.taskTTLSec }}
    limits:
      rate_limit_rpm: {{ .Values.limits.rateLimitRPM }}
      rate_limit_burst: {{ .Values.limits.rateLimitBurst }}
      max_target_len: {{ .Values.limits.maxTargetLen }}
      default_timeout_ms: {{ .Values.limits.defaultTimeoutMs }}
      max_timeout_ms: {{ .Values.limits.maxTimeoutMs }}
      per_node_dispatch_rps: {{ .Values.limits.perNodeDispatchRPS }}
      task_history_ttl_sec: {{ .Values.limits.taskHistoryTTLSec }}
      allowed_cidrs:
        {{- toYaml .Values.limits.allowedCIDRs | nindent 8 }}
      denied_cidrs:
        {{- toYaml .Values.limits.deniedCIDRs | nindent 8 }}
    dn11_prefixes:
      {{- toYaml .Values.dn11Prefixes | nindent 6 }}
