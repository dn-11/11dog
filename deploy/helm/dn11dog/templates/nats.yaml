{{- if .Values.nats.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dn11dog.fullname" . }}-nats-config
  labels:
    {{- include "dn11dog.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
data:
  nats-server.conf: |
    port: 4222
    http_port: 8222

    jetstream {
      store_dir: "/data/jetstream"
    }

    websocket {
      port: {{ .Values.nats.websocket.port }}
      no_tls: true
    }

    include auth/nats-auth.conf
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dn11dog.fullname" . }}-nats
  labels:
    {{- include "dn11dog.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
    - name: websocket
      port: {{ .Values.nats.websocket.port }}
      targetPort: {{ .Values.nats.websocket.port }}
  selector:
    {{- include "dn11dog.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nats
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dn11dog.fullname" . }}-nats
  labels:
    {{- include "dn11dog.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ include "dn11dog.fullname" . }}-nats
  replicas: 1
  selector:
    matchLabels:
      {{- include "dn11dog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        {{- include "dn11dog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nats
    spec:
      containers:
        - name: nats
          image: "{{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}"
          imagePullPolicy: {{ .Values.nats.image.pullPolicy }}
          args:
            - "-c"
            - "/etc/nats/nats-server.conf"
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
            - name: websocket
              containerPort: {{ .Values.nats.websocket.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - name: nats-config
              mountPath: /etc/nats/nats-server.conf
              subPath: nats-server.conf
              readOnly: true
            - name: nats-auth
              mountPath: /etc/nats/auth
              readOnly: true
            - name: jetstream-data
              mountPath: /data/jetstream
      volumes:
        - name: nats-config
          configMap:
            name: {{ include "dn11dog.fullname" . }}-nats-config
        - name: nats-auth
          secret:
            secretName: {{ include "dn11dog.natsAuthSecretName" . }}
  volumeClaimTemplates:
    - metadata:
        name: jetstream-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.nats.storageClassName }}
        storageClassName: {{ .Values.nats.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.storageSize }}
{{- end }}
