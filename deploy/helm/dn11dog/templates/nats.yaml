{{- if and .Values.nats.enabled (eq .Values.mq.driver "nats") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dn11dog.fullname" . }}-nats
  labels:
    {{- include "dn11dog.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
  selector:
    {{- include "dn11dog.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nats
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dn11dog.fullname" . }}-nats
  labels:
    {{- include "dn11dog.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ include "dn11dog.fullname" . }}-nats
  replicas: 1
  selector:
    matchLabels:
      {{- include "dn11dog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        {{- include "dn11dog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nats
    spec:
      containers:
        - name: nats
          image: "{{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}"
          imagePullPolicy: {{ .Values.nats.image.pullPolicy }}
          args:
            - "--jetstream"
            - "--store_dir=/data/jetstream"
            - "--http_port=8222"
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - name: jetstream-data
              mountPath: /data/jetstream
  volumeClaimTemplates:
    - metadata:
        name: jetstream-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.nats.storageClassName }}
        storageClassName: {{ .Values.nats.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.storageSize }}
{{- end }}
