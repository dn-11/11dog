{{- if and (eq .Values.db.driver "sqlite") .Values.db.sqlite.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dn11dog.fullname" . }}-data
  labels:
    {{- include "dn11dog.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.db.sqlite.persistence.storageClassName }}
  storageClassName: {{ .Values.db.sqlite.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.db.sqlite.persistence.size }}
{{- end }}
