apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dn11dog.fullname" . }}
  labels:
    {{- include "dn11dog.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dn11dog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.auth.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dn11dog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and (eq .Values.db.driver "sqlite") .Values.db.sqlite.persistence.enabled }}
      securityContext:
        fsGroup: 10001
      {{- end }}
      containers:
        - name: 11dog-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/11dog/server.yaml
          env:
            - name: DOG_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "dn11dog.secretName" . }}
                  key: admin-token
            {{- if .Values.db.existingSecret }}
            - name: DOG_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.existingSecret }}
                  key: db-dsn
            {{- else if and (ne .Values.db.driver "sqlite") .Values.db.dsn }}
            - name: DOG_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "dn11dog.secretName" . }}
                  key: db-dsn
                  optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/11dog/server.yaml
              subPath: server.yaml
              readOnly: true
            {{- if and (eq .Values.db.driver "sqlite") .Values.db.sqlite.persistence.enabled }}
            - name: sqlite-data
              mountPath: /var/lib/11dog
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dn11dog.fullname" . }}-config
        {{- if and (eq .Values.db.driver "sqlite") .Values.db.sqlite.persistence.enabled }}
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: {{ include "dn11dog.fullname" . }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
